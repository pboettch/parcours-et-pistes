name: pep_core
description: >-
  Parcours et Pistes project sessions: maps the content model (pep_content)
  onto the secure channel (pep_channel). Entry point for the apps; includes
  the pep CLI.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.7.0
  pep_channel:
    path: ../pep_channel
  pep_content:
    path: ../pep_content

dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.1.0
  test: ^1.32.0

executables:
  pep: pep
