name: pep_channel
description: >-
  Secure channel of Parcours et Pistes: end-to-end encrypted, signed and
  access-controlled collections of opaque items over MQTT 5.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.3.0
  crypto: ^3.0.7
  meta: ^1.19.0
  mqtt5_client: ^5.0.0
  sodium: ^4.1.1+1
  typed_data: ^1.4.0

dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.1.0
  test: ^1.32.0
