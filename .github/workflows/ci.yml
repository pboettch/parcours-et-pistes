name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The workspace contains the Flutter app, so every job uses the Flutter SDK
# (stable channel), which bundles Dart (the libraries require Dart >= 3.9).

jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages apps/pep_app/lib .claude/scripts
      - name: Analyze packages
        run: dart analyze --fatal-infos packages
      - name: Analyze app
        working-directory: apps/pep_app
        run: flutter analyze --fatal-infos

  app:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Fetch sodium.js
        working-directory: apps/pep_app
        run: dart run sodium:update_web --sumo --no-edit-index
      - name: Build (release)
        working-directory: apps/pep_app
        run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: pep_app-web
          path: apps/pep_app/build/web
          retention-days: 7

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pep_content, pep_channel, pep_core]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get

      - name: Start MQTT test broker
        if: matrix.package != 'pep_content'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mosquitto
          .claude/scripts/broker.sh start

      - name: Fetch sodium.js for browser tests
        if: hashFiles(format('packages/{0}/test/web/template.html.tpl', matrix.package)) != ''
        run: .claude/scripts/fetch_sodium_js.sh ${{ matrix.package }}

      - name: Test (Dart VM, with coverage)
        working-directory: packages/${{ matrix.package }}
        run: dart test -p vm --coverage=coverage --reporter=github

      - name: Test (Chrome)
        working-directory: packages/${{ matrix.package }}
        run: dart test -p chrome --reporter=github

      - name: Convert coverage to LCOV
        working-directory: packages/${{ matrix.package }}
        run: >-
          dart run coverage:format_coverage --lcov --check-ignore --in=coverage
          --out=lcov.info --report-on=lib --base-directory="$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/lcov.info
          retention-days: 7

      - name: Upload broker log on failure
        if: failure() && matrix.package != 'pep_content'
        uses: actions/upload-artifact@v7
        with:
          name: broker-log-${{ matrix.package }}
          path: tools/broker/log/
          retention-days: 7

  coverage:
    name: Coverage report
    needs: test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Merge LCOV files
        run: cat coverage/*/lcov.info > coverage/lcov.info
      - name: Summary
        run: python3 .claude/scripts/coverage_summary.py coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 30
      - name: Upload to Codecov
        # Runs only once the CODECOV_TOKEN repository secret exists.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false
