# Development broker for Parcours et Pistes — NOT for production.
# Started user-locally by .claude/scripts/broker.sh (paths are relative to tools/broker/).
per_listener_settings false
allow_anonymous true

persistence true
persistence_location data/
log_dest file log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Plain MQTT (Dart VM tests, CLI)
listener 18883 127.0.0.1
protocol mqtt

# MQTT over WebSocket (browser tests)
listener 18080 127.0.0.1
protocol websockets

# Large retained GPX payloads are fine; cap at 16 MiB.
message_size_limit 16777216
