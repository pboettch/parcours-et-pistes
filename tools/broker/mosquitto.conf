# Development broker for Parcours et Pistes — NOT for production.
# Started user-locally by .claude/scripts/broker.sh, which also generates the
# test certificates (certs/) and the password file (passwd). Paths are relative
# to tools/broker/.
per_listener_settings true

persistence true
persistence_location data/
log_dest file log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Plain MQTT (Dart VM tests, CLI)
listener 18883 127.0.0.1
protocol mqtt
listener_allow_anonymous true
max_packet_size 16777216

# MQTT over WebSocket (browser tests)
listener 18080 127.0.0.1
protocol websockets
listener_allow_anonymous true
max_packet_size 16777216

# MQTT over TLS
listener 18884 127.0.0.1
protocol mqtt
listener_allow_anonymous true
certfile certs/server.pem
keyfile certs/server.key
max_packet_size 16777216

# MQTT over secure WebSocket
listener 18443 127.0.0.1
protocol websockets
listener_allow_anonymous true
certfile certs/server.pem
keyfile certs/server.key
max_packet_size 16777216

# Authenticated listener with ACL (tests of refused login/subscribe/publish).
# user "pep", password "pep-secret": read/write only below pep-acl/allowed/.
listener 18885 127.0.0.1
protocol mqtt
listener_allow_anonymous false
password_file passwd
acl_file acl
max_packet_size 16777216
